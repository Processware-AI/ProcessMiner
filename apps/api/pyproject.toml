[project]
name = "processminer-api"
version = "0.1.0"
description = "ProcessMiner API — 멀티테넌트 프로세스 자산 관리 플랫폼"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",  # 원문 파일 업로드
    "pypdf>=5.0",  # PDF 본문 추출
    "anthropic>=1.0",  # 요건 도출·문서 생성
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI 의 Depends() 기본값 패턴

[tool.ruff.lint.per-file-ignores]
"app/cli.py" = ["E501"]  # 데모 문서 본문
